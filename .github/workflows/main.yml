name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Master Build Step
        run: |
          rm -rf android
          flutter create --platforms=android .
          flutter pub get
          
          # 1. Music Player ke liye minSdk 23 karna
          sed -i 's/minSdk = flutter\.minSdkVersion/minSdk = 23/g' android/app/build.gradle.kts
          
          # 2. File Picker ke liye compileSdk 36 karna (Naya Fix)
          sed -i 's/compileSdk = flutter\.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts
          
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Book-Revision-App
          path: build/app/outputs/flutter-apk/app-release.apk
