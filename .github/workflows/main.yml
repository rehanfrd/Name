name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Is ek single step mein saara kaam safe tarike se hoga
      - name: Master Build Step
        run: |
          # 1. Puraana kachra saaf karein taaki koi conflict na ho
          rm -rf android
          
          # 2. Fresh Android files banayein
          flutter create --platforms=android .
          
          # 3. Packages update karein
          flutter pub get
          
          # 4. Official tarike se minSdk 23 set karein (Bina file edit kiye)
          echo "flutter.minSdkVersion=23" >> android/local.properties
          
          # 5. App ka APK banayein
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Book-Revision-App
          path: build/app/outputs/flutter-apk/app-release.apk
