name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Master Build Step
        run: |
          # 1. Naye project ka setup
          rm -rf android
          flutter create --platforms=android --org=com.rehan.revision .
          flutter pub get
          
          # 2. Default gradle file ko delete karna
          rm android/app/build.gradle.kts
          
          # 3. Khud ki nayi gradle file banana exact versions ke sath
          cat << 'EOF' > android/app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }
          
          android {
              namespace = "com.rehan.revision"
              compileSdk = 36
              ndkVersion = flutter.ndkVersion
          
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }
          
              kotlinOptions {
                  jvmTarget = JavaVersion.VERSION_1_8.toString()
              }
          
              defaultConfig {
                  applicationId = "com.rehan.revision"
                  minSdk = 23
                  targetSdk = 34
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
              }
          
              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
          }
          
          flutter {
              source = "../.."
          }
          EOF
          
          # 4. Storage permissions add karna
          sed -i '/<application/i \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>' android/app/src/main/AndroidManifest.xml
          
          # 5. Build start karna
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Book-Revision-App
          path: build/app/outputs/flutter-apk/app-release.apk
