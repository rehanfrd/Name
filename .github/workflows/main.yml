name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Master Build Step
        run: |
          # 1. Purana data saaf karein aur fresh Android files banayein
          rm -rf android
          flutter create --platforms=android --org=com.rehan.revision .
          flutter pub get
          
          # 2. Wildcard (.*) ka use karke SDK numbers ko safely overwrite karein
          sed -i 's/compileSdk = .*/compileSdk = 36/g' android/app/build.gradle.kts
          sed -i 's/minSdk = .*/minSdk = 23/g' android/app/build.gradle.kts
          sed -i 's/targetSdk = .*/targetSdk = 34/g' android/app/build.gradle.kts
          
          # 3. Permissions inject karein
          sed -i '/<application/i \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>' android/app/src/main/AndroidManifest.xml
          
          # 4. Final APK build karein
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Book-Revision-App
          path: build/app/outputs/flutter-apk/app-release.apk
