name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Master Build Step
        run: |
          # 1. Purana kachra saaf karein
          rm -rf android
          
          # 2. Fresh Android files banayein
          flutter create --platforms=android --org=com.rehan.revision .
          flutter pub get
          
          # 3. SDK Versions ko direct number se replace karein (Bulletproof method)
          sed -i 's/flutter\.compileSdkVersion/36/g' android/app/build.gradle.kts
          sed -i 's/flutter\.minSdkVersion/23/g' android/app/build.gradle.kts
          sed -i 's/flutter\.targetSdkVersion/34/g' android/app/build.gradle.kts
          
          # 4. Music aur Storage Permissions add karein
          sed -i '/<application/i \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>' android/app/src/main/AndroidManifest.xml
          
          # 5. Final APK banayein
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Book-Revision-App
          path: build/app/outputs/flutter-apk/app-release.apk
          
